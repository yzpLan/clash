# OpenClash module: ACL4SSR Smart Lite
# Keeps original DNS, hosts, proxies and proxy-providers untouched.
# Requires Mihomo and rule-providers format: text.
# CAUTION: replaces original proxy-groups and rules.
[YAML]
rule-providers:
  MyDirect:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/yzpLan/clash/refs/heads/main/MyDirect.list
    path: ./ruleset/acl4ssr_MyDirect.list
    interval: 86400
  MyEmby:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/yzpLan/clash/refs/heads/main/MyEmby.list
    path: ./ruleset/acl4ssr_MyEmby.list
    interval: 86400
  MyProxy:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/yzpLan/clash/refs/heads/main/MyProxy.list
    path: ./ruleset/acl4ssr_MyProxy.list
    interval: 86400
  BanAD:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
    path: ./ruleset/acl4ssr_BanAD.list
    interval: 86400
  Telegram:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
    path: ./ruleset/acl4ssr_Telegram.list
    interval: 86400
  AI:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
    path: ./ruleset/acl4ssr_AI.list
    interval: 86400
  YouTube:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
    path: ./ruleset/acl4ssr_YouTube.list
    interval: 86400
  ProxyGFWlist:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list
    path: ./ruleset/acl4ssr_ProxyGFWlist.list
    interval: 86400
  ChinaDomain:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
    path: ./ruleset/acl4ssr_ChinaDomain.list
    interval: 86400
proxy-groups!:
- name: 🚀 节点选择
  type: select
  proxies:
  - ♻️ 自动选择
  - 📌 手动切换
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇸🇬 狮城节点
  - 🇨🇳 台湾节点
  - 🇰🇷 韩国节点
  - DIRECT
- name: 📌 手动切换
  type: select
  include-all: true
  filter: .*
  proxies:
  - DIRECT
- name: ♻️ 自动选择
  type: url-test
  include-all: true
  filter: .*
  proxies: []
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🎬 EMBY影院
  type: select
  proxies:
  - 🚀 节点选择
  - 📌 手动切换
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇸🇬 狮城节点
  - 🇨🇳 台湾节点
  - 🇰🇷 韩国节点
  - DIRECT
- name: 📲 电报消息
  type: select
  proxies:
  - 🚀 节点选择
  - 📌 手动切换
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇸🇬 狮城节点
  - 🇨🇳 台湾节点
  - 🇰🇷 韩国节点
  - DIRECT
- name: 💬 Ai平台
  type: select
  proxies:
  - 🚀 节点选择
  - 📌 手动切换
  - 🇺🇲 美国节点
  - 🇯🇵 日本节点
  - 🇸🇬 狮城节点
  - 🇭🇰 香港节点
  - 🇨🇳 台湾节点
  - 🇰🇷 韩国节点
  - DIRECT
- name: 📹 油管视频
  type: select
  proxies:
  - 🚀 节点选择
  - 📌 手动切换
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇸🇬 狮城节点
  - 🇨🇳 台湾节点
  - 🇰🇷 韩国节点
  - DIRECT
- name: 🎯 全球直连
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
- name: 🛑 广告拦截
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT
- name: 🇭🇰 香港节点
  type: select
  proxies:
  - 🇭🇰 香港自动
  include-all: true
  filter: (港|HK|hk|Hong Kong|HongKong|hongkong)
- name: 🇭🇰 香港自动
  type: url-test
  include-all: true
  filter: (港|HK|hk|Hong Kong|HongKong|hongkong)
  proxies: []
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🇯🇵 日本节点
  type: select
  proxies:
  - 🇯🇵 日本自动
  include-all: true
  filter: (日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)
- name: 🇯🇵 日本自动
  type: url-test
  include-all: true
  filter: (日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)
  proxies: []
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🇺🇲 美国节点
  type: select
  proxies:
  - 🇺🇲 美国自动
  include-all: true
  filter: (美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)
- name: 🇺🇲 美国自动
  type: url-test
  include-all: true
  filter: (美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)
  proxies: []
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 150
- name: 🇸🇬 狮城节点
  type: select
  proxies:
  - 🇸🇬 狮城自动
  include-all: true
  filter: (新加坡|坡|狮城|SG|Singapore)
- name: 🇸🇬 狮城自动
  type: url-test
  include-all: true
  filter: (新加坡|坡|狮城|SG|Singapore)
  proxies: []
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🇨🇳 台湾节点
  type: select
  proxies:
  - 🇨🇳 台湾自动
  include-all: true
  filter: (台|新北|彰化|TW|Taiwan)
- name: 🇨🇳 台湾自动
  type: url-test
  include-all: true
  filter: (台|新北|彰化|TW|Taiwan)
  proxies: []
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🇰🇷 韩国节点
  type: select
  proxies:
  - 🇰🇷 韩国自动
  include-all: true
  filter: (KR|Korea|KOR|首尔|韩|韓)
- name: 🇰🇷 韩国自动
  type: url-test
  include-all: true
  filter: (KR|Korea|KOR|首尔|韩|韓)
  proxies: []
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
rules!:
- RULE-SET,MyDirect,🎯 全球直连
- RULE-SET,MyEmby,🎬 EMBY影院
- RULE-SET,MyProxy,🚀 节点选择
- RULE-SET,BanAD,🛑 广告拦截
- RULE-SET,Telegram,📲 电报消息
- RULE-SET,AI,💬 Ai平台
- RULE-SET,YouTube,📹 油管视频
- RULE-SET,ProxyGFWlist,🚀 节点选择
- RULE-SET,ChinaDomain,🎯 全球直连
- GEOIP,CN,🎯 全球直连
- MATCH,🐟 漏网之鱼
